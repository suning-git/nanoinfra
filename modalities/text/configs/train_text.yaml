# train_text.yaml — config for the blessed text-pretrain orchestrator
# (modalities/text/train_text.py).
#
# Composition: mechanism defaults come from core/configs/train_base.yaml
# (optimizer/scheduler/checkpoint/logging/eval cadence — the knobs of core
# machinery); everything MODALITY-side (the data sources, model scale) lives
# HERE with the orchestrator that assembles it. The orchestrator registers
# core/configs on hydra's search path, so train_base resolves from any config.

defaults:
  - train_base
  - _self_

# ----------------------------------------------------------------------------
# Hardware / batch
# ----------------------------------------------------------------------------
sequence_len: 512               # T: positions per row, for the Trainer, the GPT and the batcher; each source
                                #   window is T + 1 raw tokens. MFU rises with seq (audit: d12 512->2048 = +8.6 pts)
                                # A run trained before 2026-10 with sequence_len 512 had rows of 511, stored in
                                #   bf16. To continue it on its own cut: param_dtype=bf16, sequence_len=511,
                                #   total_batch_size=130816 (16 rows x 511 positions x 16 micro-batches) and
                                #   max_steps= that run's (the automatic count follows total_batch_size). With
                                #   param_dtype=bf16 and the other defaults it continues on the new cut;
                                #   val/text_ce then reads high at first (the recipe's text_end sits one position
                                #   later than the old model learned; d12: +0.018, gone by the eval 250 steps later).
                                #   (checkpoint.allow_param_dtype_change=true instead converts it to fp32 storage.)
device_batch_size: 16
total_batch_size: 131072

# ----------------------------------------------------------------------------
# Model — ONLY the trunk geometry. vocab_size and n_token_types are NOT config:
# they come from the assembled VocabLayout at runtime (the config cannot
# disagree with the trained artifact).
#
# MFU expectations on this box (RTX 5090, single GPU, compiled trunk). These depend
# on `head_ce` below as much as on depth, because the un-embedding is a third of the
# parameters at d6 and nearly half at d2:
#   naive 24% | liger 48% | compiled 61%   (d6)
#   naive 53% | liger 63% | compiled 73%   (d12)
# The default below is `compiled`, i.e. the RIGHT column.
# Shallow models CANNOT reach high MFU (384-wide GEMMs cap at ~70% of peak;
# the un-embedding outweighs the trunk) — depth is the main MFU lever.
# ----------------------------------------------------------------------------
model:
  depth: 6                      # smoke-scale default; raise for real runs
  # Geometry DERIVATION RULES — written here (not hidden in orchestrator code)
  # so the config dump shows real values and the CLI composes naturally:
  # `model.depth=20` re-derives dim/heads; `model.dim=1024` replaces the rule.
  dim: ${eval:'${model.depth} * 64'}                      # house family: dim = 64·depth
  n_head: ${eval:'max(1, (${model.dim} + 127) // 128)'}   # 128-wide heads
  n_kv_head: ${model.n_head}                              # no GQA by default
  trunk_class: null             # default: the reference GPT. Set an import path
                                #   (pkg.mod.ClassName) to build a custom trunk that
                                #   satisfies the trunk contract — e.g. an architecture ablation.

max_steps: -1                   # auto (Chinchilla, target_param_data_ratio) unless overridden
compile_trunk: true             # audit: +19-34% tok/s; keep on. The script decides HOW after assembly
                                #   (whole trunk, or per block under NanoDDP); head_ce picks the head's CE.

# Which implementation computes the head's cross-entropy: naive | liger | compiled.
# It matters most where the model is SMALL — a shallow trunk is outweighed by its own
# un-embedding, so the head is a large fraction of the step (measured: d6 24.4% ->
# 60.8% MFU across the three). There is deliberately no "auto": which arm a run takes
# must not depend on what happens to be pip-installed, because the arms differ in
# NUMERICS, not just speed. See core/training/model_setup.py for what each value
# means and what each was measured at. compiled since 2026-10-22 (it was naive, core's
# default): the fastest, needs no optional package, the closest to naive in numbers; d6 on
# one RTX 5090, 300 steps: naive 390 / liger 316 / compiled 160 ms a step, peak 5.36 /
# 1.50 / 1.88 GiB, val at step 299 the same to four places.
head_ce: compiled
deterministic: false             # torch.use_deterministic_algorithms(True) for the run (the 2026-10 storage-precision experiments); ~6% slower

# Multi-GPU strategy: "ddp" replicates the model and reduces gradients during
# backward, "fsdp" shards parameters. Ignored on one GPU. While the model FITS,
# replicating wins — the bottleneck is activations, not parameters, so sharding
# costs an all-gather per block and saves nothing. See train_text_1p4b.yaml.
parallel: fsdp
# Under ddp, the dtype the gradients are all-reduced in: null = each in its own (the storage dtype) | bf16 | fp32.
# bf16 halves the traffic of fp32 storage; worth it across nodes (NanoDDP's reduce_dtype). Ignored otherwise.
ddp_reduce_dtype: null

# ----------------------------------------------------------------------------
# Data — the text modality's source declaration (FineWeb streaming through
# TextDataSource; on-the-fly BPE is fully hidden behind compute — audit M2).
# ----------------------------------------------------------------------------
data:
  # Datasets declare their own splits. Nothing is inferred from the directory
  # listing: `val` is PINNED and `train` is the complement, so downloading more
  # shards grows train and leaves the ruler untouched (the reverse convention
  # silently invalidated every historical number). See modalities/text/datasets.py.
  datasets:
    fineweb:
      kind: parquet_text
      # dir: <defaults to $NANOINFRA_DATA_DIR or <base>/base_data>
      splits:
        val:   {files: [shard_005_00000.parquet]}   # a LIST — pin as many as you want
        train: {rest: true}

  # Recipes are named here and referenced by name from BOTH training sources and
  # evaluation streams, so the two cannot drift apart unnoticed.
  recipes:
    text_pretrain:
      template: [bos, text_start, text_tokens, text_end, eos]
      supervise: all

  sources:
    - type: text
      dataset: fineweb
      split: train
      recipe: text_pretrain
      weight: auto              # auto weight from the token budget below
      tokens: 268435456         # ~268M-token budget (~0.37 of a 721M-token shard)
      buffer_batch_size: 32
      tokenizer_threads: 4      # audit: 4 vs 16 makes no difference
      tokenizer_batch_size: 128
      # sample_len: 513         # raw tokens per window; default sequence_len + 1 (rows of sequence_len)

optimizer:
  # 2026-07 LR audit: the Muon-era matrix lr
  # 3e-4 (the inherited conservative default). The short-horizon audit said 6e-4 improves val CE by 0.049 and pushed this to 6e-4 — but
  # the PRODUCTION-horizon re-bracket (exemplars/text_pretrain, full 2.705B
  # tokens) INVERTED that: 3e-4 3.8101 < 6e-4 3.8150 < 2.4e-3 3.8643 <
  # 1.2e-3 3.9307. Short probes overestimate the optimum; 3e-4 was right all
  # along. Reverted 2026-07-07 (Ning's call). (That ranking was read on the July validation
  # protocol; re-read on the current one, the same checkpoints rank 6e-4 3.44 < 1.2e-3 3.45 <
  # 3e-4 3.52 at step 20000, and the exemplar's champion now trains at 6e-4 — see its
  # provenance.md. This default is unchanged.) embedding_lr/unembedding_lr
  # (train_base defaults 0.2/0.004) each PASSED their audit — keep.
  lr_max: 3.0e-4

# Evaluation is a LIST of declared streams, each naming its dataset/split/recipe.
# Adding a domain (code, math, …) is one more entry, not a schema change.
evaluation:
  enabled: true
  interval_steps: 250           # eval cadence; a full eval also fires at the final step
  eval_at: null                 # optional EXPLICIT schedule (list of steps; overrides
                                #   interval_steps) — e.g. log-spaced for scaling curves
  eval_tokens: 1048576          # ~1M val tokens per eval (SE ≈ 0.003 nat — plenty)
  streams:
    # THE metric: assembled exactly like training. One ruler, and it is this one.
    - name: text
      dataset: fineweb
      split: val
      recipe: text_pretrain
      metric: val/text_ce
      bpb_metric: val/bpb
    # A stream may also declare `recipe: null` ("assemble nothing" — raw packing).
    # That is a real capability, not shipped here: the only current user is a
    # project-side migration bridge that re-measures the pre-2026-07-26 ruler so
    # historical curves can be reconnected. (Deliberately not naming the project:
    # a modality that points at a project goes stale the moment that project is
    # renamed -- which is exactly what happened to the previous version of this
    # comment.) A migration artifact belongs to the project doing the
    # migrating, not to the modality everyone inherits.

checkpoint:
  enabled: false                # flip on (train_base has save_every/save_dir) for real runs

wandb:
  enabled: false                # opt in explicitly
  project: nanoinfra
  name: "train_text_d${model.depth}"
