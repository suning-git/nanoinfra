# train_base.yaml - the shared base of the sample training configs
#
# The sample orchestrators' configs (modalities/text, exemplars/*, projects/nano_*) inherit it through Hydra
# (`defaults: [train_base]`) and override what they change; another project may inherit it, copy it or write its own.
# Its values are those samples' choices, layered over each core component's own defaults.
#
# Design:
# - Core training params live at the top level (max_steps, sequence_len, ...)
# - Each component's config lives in a first-level submodule (model, data, optimizer, checkpoint, ...)
# - Trainer is the coordinator: it wires model + data + optimizer + checkpoint + logging

# ============================================================================
# Core training params
# ============================================================================
max_steps: -1                # total training steps (-1 = auto-compute from the Chinchilla scaling rule)
target_param_data_ratio: 20  # used when auto-computing max_steps (Chinchilla optimal = 20)
num_iterations: -1           # stop after this many steps from where the launch starts (-1 = run to max_steps); the
                             # LR still follows max_steps; the stop step is logged, evaluated and saved like the
                             # last step
seed: 42                     # RNG seed (init + training; the orchestrator passes it to build_system)
param_dtype: fp32            # what parameters, gradients and AdamW moments are STORED in: fp32 | bf16 (to compare
                             #   with runs trained in bf16 storage, with their code version). The forward runs
                             #   under bf16 autocast either way. Training entries pass it on to build_system
                             #   (its param_dtype; parameters only, a model's buffers keep their own dtype);
                             #   inference (load_system) loads bf16 by default.
abort_on_nonfinite: true     # stop the moment the gradient norm goes nan/inf, BEFORE the optimizer
                             #   writes it into the weights. This loop runs under bf16 autocast with no GradScaler, so a
                             #   non-finite gradient is never routine and never heals: clip_grad_norm_
                             #   divides by that norm, so one nan poisons every weight from then on.
                             #   Set false only to reproduce legacy behaviour (train on through it).

# ============================================================================
# Hardware and batch config
# ============================================================================
sequence_len: 2048           # sequence length
device_batch_size: 16        # per-device batch size
total_batch_size: 524288     # total batch size (tokens), used to compute gradient accumulation

# ============================================================================
# Model config — trunk geometry only. vocab_size / n_token_types are NOT config:
# they are assembly facts, taken at runtime from the VocabLayout (config must not disagree with the artifact).
# ============================================================================
model:
  depth: 12                  # model depth (required; used to derive n_layer, n_head, n_embd)

# (no data config — data sources are declared modality-side and follow the orchestrator's config,
#   e.g. data.sources in modalities/text/configs/train_text.yaml)

# ============================================================================
# Optimizer config
# ============================================================================
optimizer:
  type: adamw                # optimizer type (only adamw is supported currently)

  # lr_max, the matrix group's peak learning rate (before build_optimizers scales every group by
  # 1/sqrt(n_embd / 768)), is not set here: each recipe sets it for its model (when no config sets it,
  # build_optimizers uses its own default, 3e-4).

  # Default params (overridable in the Recipe):
  max_grad_norm: 1.0         # gradient-clipping threshold
  weight_decay: 0.01         # AdamW weight decay
  betas: [0.9, 0.95]         # Adam betas (eps = 1e-10 and the fused kernel are fixed in core/training/optim.py)

  # Multi-LR strategy:
  unembedding_lr: 0.004      # unembedding-layer learning rate
  embedding_lr: 0.2          # embedding-layer learning rate

  # LR Scheduler config
  scheduler:
    type: linear             # scheduler type: linear | cosine
    warmup_steps: 0          # warmup in ABSOLUTE steps (core speaks absolute steps: warmup is optimizer
                             #   physics and does not scale with the budget; a recipe that wants a ratio has the orchestrator convert it)
    warmdown_ratio: 0.2      # warmdown as a fraction of total steps (linear only; warmdown is anchored to the
                             #   end of the horizon, so a fraction is its natural parameter)
    final_lr_frac: 0.0       # where the decay heads: final_lr_frac x each group's initial LR, reached one step after
                             #   the last update (the last one uses a little more; linear: no effect with warmdown 0)

# ============================================================================
# Checkpoint config
# ============================================================================
checkpoint:
  enabled: true              # enable checkpoint saving
  save_every: 5000           # save frequency (steps; -1 = save only at the end of training)
  save_dir: "${oc.env:NANOINFRA_BASE_DIR,./outputs}/checkpoints/d${model.depth}_${wandb.name}"  # dynamic path (references model.depth and wandb.name)
  keep_last_n: 2             # keep the most recent N >= 1 checkpoints (-1 = keep all)
  resume_from: null          # resume path (null = train from scratch | auto = auto-find | explicit path = resume from it)
  init_model_from: null      # model-weight init path (loads model only; optimizer/dataloader start fresh)
  # Resume policy for initial_lr / weight_decay / betas / eps in the constructed groups:
  # false: reject differences from the checkpoint. true: adopt all current values,
  # including defaults, while retaining restored weights, moments and progress.
  # Has no effect without a resume. Must be a boolean on every path.
  override_optimizer_hparams: false
  # A resume refuses a model whose parameters are stored in another dtype than the checkpoint's (param_dtype,
  # bf16 vs fp32): DCP would convert weights and moments silently. true converts deliberately (bf16 -> fp32 exact,
  # fp32 -> bf16 rounded) and records it in meta.json's param_dtype_history. Weights-only loads always convert.
  allow_param_dtype_change: false

# ============================================================================
# Logging config
# ============================================================================
logging:
  log_every: 1              # console log frequency (steps)
  wandb_log_every: 100       # Wandb log frequency (steps)

# ============================================================================
# Evaluation config — cadence comes from `evaluation.interval_steps`, or from an
# explicit `evaluation.eval_at` step list; a full eval always fires on the last
# step. (Pre-2026-07 configs addressed a per-evaluator `evaluation.<name>.*`; that
# schema is gone, and overriding it now fails loudly instead of being ignored.)
# ============================================================================
evaluation: {}

# ============================================================================
# Profiling config (disabled by default; for performance debugging)
# ============================================================================
profiling:
  enabled: false             # enable profiling
  start_step: 5              # step at which to start profiling
  end_step: 10               # step at which to stop profiling
  save_dir: "./traces"       # trace-file output path
  profile_rank_0_only: true  # profile rank 0 only
  record_shapes: true        # record tensor shapes
  with_stack: true           # record the Python call stack
  profile_memory: false      # profile memory usage

# ============================================================================
# Wandb config
# ============================================================================
wandb:
  enabled: true              # enable wandb
  project: nanoinfra        # Wandb project name
  name: base_run             # Wandb run name
