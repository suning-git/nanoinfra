# base.yaml — what the three lines SHARE.
#
# Mechanism defaults come from core/configs/train_base.yaml (optimizer, scheduler,
# checkpoint, logging, profiling). This file holds the choices that are the same on
# every line of THIS project; text.yaml / motion.yaml / video.yaml hold the four
# things that differ.
#
# NOT settable anywhere, on purpose:
#   vocab_size, n_token_types  — facts of the vocab assembly (assembly.py). A config
#     constant can disagree with the artifact, and a band offset that is wrong by one
#     trains perfectly and decodes into nonsense.

# train.py registers core/configs on hydra's search path with a SearchPathPlugin,
# NOT with `hydra.searchpath:` in yaml. The difference is load-bearing here: hydra
# ignores that key in any config reached through a defaults list, and base.yaml is
# never the entry point — text.yaml / motion.yaml / video.yaml are. A plugin applies
# either way. (modalities/text/train_text.py documents the same trap.)
defaults:
  - train_base
  - _self_

seed: 42
compile_trunk: true   # this script decides how to compile the trunk after assembly (build_system does not); the head's CE implementation is head_ce

# Which implementation computes the head's cross-entropy: naive | liger | compiled.
# It matters most where the model is SMALL — a shallow trunk is outweighed by its own
# un-embedding. There is deliberately no "auto": the three arms differ in NUMERICS,
# not only speed, so which arm a run takes must not depend on what happens to be
# pip-installed. RE-MEASURE ON A100 before pinning: every published figure for these
# arms in this repo was measured on an RTX 5090.
head_ce: liger

# "ddp" replicates the model and reduces gradients during backward (NanoDDP);
# "fsdp" shards parameters. Ignored on one GPU. While the model FITS, replicating
# wins — the bottleneck is activations, not parameters. All three models here fit.
parallel: ddp

# BATCH IS NOT HERE. It used to be — one `total_batch_rows: 32` shared by all three
# lines — and that number came from the VIDEO line's measured knee (">=32k supervised
# tokens per update"). Inherited by the text line it silently became 32 x 512 = 16,384
# tokens against exemplars/text_pretrain's proven 131,072, an eight-fold difference in
# a recipe whose learning rate was tuned AT that batch size. A shared default that is
# right for one line is a wrong recipe for the others, quietly.
#
# So each line declares its own, with the reason. What stays shared is the MECHANISM:
# batch is written in ROWS, and train.py derives tokens from rows — core's Trainer
# asserts total_batch_size % (device_batch_size * sequence_len * world_size) == 0, and
# a class with 3 or 5 GPUs trips that at startup on a message that talks about tokens
# and never mentions GPUs.

evaluation:
  n_batches: 20        # frozen val batches; a ruler that moves is not a ruler
  batch: 8
  interval_steps: 500
  eval_at: null        # explicit log-spaced schedule (used by scaling.py)

checkpoint:
  enabled: true
  save_every: 2000
  keep_last_n: 2
  # Under the PROJECT, not core's default ./outputs/checkpoints/d<depth>_<wandb.name>
  # — three lines at the same depth would otherwise collide in one directory, and
  # the run's metrics.jsonl lands beside its weights.
  save_dir: "${repo:projects/nano_multimodal/outputs/models}/nmm_${line}_d${model.depth}"

logging:
  log_every: 50

wandb:
  enabled: false       # metrics.jsonl is written regardless — see metrics.py
  project: nano_multimodal
  name: "nmm_${line}_d${model.depth}"
