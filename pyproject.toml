[project]
name = "nanoinfra"
version = "0.2.0"
description = "Modality-agnostic training infrastructure for decoder-only transformers"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
dependencies = [
    # >=2.6: F.scaled_dot_product_attention(..., enable_gqa=) arrived in 2.5 and
    # FSDP2 fully_shard stabilised in 2.6. Verified lower bound, not minimum
    # viable -- 2.5 was never tested here.
    "torch>=2.6",
    "numpy",
    # Direct dependency, not transitive: fineweb.py, train_tokenizer.py,
    # download_shards.py and nano_world_model's encode.py all `import
    # pyarrow.parquet`. It used to arrive via `datasets`, which nothing imports --
    # a ghost dependency holding up the core data path, and one that forced
    # pyarrow>=21 for no functionality. NO UPPER BOUND on purpose: a site that
    # needs one (old glibc, say) pins it in its own constraints file rather than
    # making every modern distro pay for it.
    "pyarrow",
    "hydra-core>=1.3",
    "omegaconf>=2.3",
    "tiktoken>=0.11.0",
    "rustbpe>=0.1.0",
    "huggingface_hub",
    "tqdm",
    "regex",
]

# Importable packages: `core` (mechanisms, zero-modality) and `modalities`
# (per-modality implementations + the assembler; core never imports it).
[tool.setuptools.packages.find]
where = ["."]
include = ["core*", "modalities*"]

# Non-Python runtime files must ship in the wheel: Hydra composes the yamls from the
# installed package (`pkg://core.configs` / `modalities/text/configs`, no source tree
# needed), and each motion tokenizer's recipe() reads the recipe.yaml next to it.
[tool.setuptools.package-data]
"core.configs" = ["*.yaml"]
"modalities.text" = ["configs/*.yaml"]
"modalities.motion.tokenizers.rot139_kin_fsq2" = ["recipe.yaml"]
"modalities.motion.tokenizers.rot139_vqvae" = ["recipe.yaml"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

# Soft dependencies — both are guarded imports, so the base install runs without
# them; add whichever you want:
#   wandb        experiment logging (Trainer no-ops to a DummyWandb without it)
#   liger-kernel fused cross-entropy kernel (guarded import in core/model/heads.py)
[project.optional-dependencies]
wandb = ["wandb>=0.21.3"]
liger = ["liger-kernel"]
# HuggingFaceTokenizer branch only (tokenizer.py guards the import). The default
# RustBPE path needs rustbpe + tiktoken and nothing else.
hf-tokenizer = ["tokenizers>=0.22.0"]
